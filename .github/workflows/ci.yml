name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  php:
    name: PHP quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPCS
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test

  wp-smoke:
    name: WP smoke (WP 6.7.2)
    runs-on: ubuntu-latest
    needs: [php]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Start wp-env
        run: npx wp-env start --update

      - name: Activate plugin
        run: npx wp-env run cli wp plugin activate lock-bad-user

      - name: Verify plugin is active
        run: npx wp-env run cli wp plugin list --status=active --field=name | grep lock-bad-user

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
