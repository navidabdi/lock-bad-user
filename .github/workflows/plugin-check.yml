name: Plugin Check

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install wp-env
        run: npm install -g @wordpress/env

      - name: Create wp-env config
        run: |
          cat > .wp-env.json << 'EOF'
          {
            "core": "WordPress/WordPress#6.7.2",
            "plugins": [
              ".",
              "https://downloads.wordpress.org/plugin/plugin-check.zip"
            ]
          }
          EOF

      - name: Start wp-env
        run: wp-env start

      - name: Activate plugin-check
        run: wp-env run cli wp plugin activate plugin-check

      - name: Run Plugin Check
        run: |
          wp-env run cli wp plugin check lock-bad-user \
            --format=table \
            --ignore-warnings \
            --exclude-directories=.github,tests,vendor,node_modules \
            --exclude-files=composer.json,composer.lock,package.json,package-lock.json,phpcs.xml.dist,phpstan.neon.dist,phpunit.xml.dist,.wp-env.json,.distignore,.gitignore,.gitattributes,Readme.md

      - name: Stop wp-env
        if: always()
        run: wp-env stop
