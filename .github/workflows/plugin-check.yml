name: Plugin Check

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove .wp-env.json so plugin-check-action creates its own config
        run: rm -f .wp-env.json

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: "./"
          exclude-directories: ".github,.idea,.claude,.codex,tests,vendor,node_modules"
          exclude-files: "composer.json,composer.lock,package.json,package-lock.json,phpcs.xml.dist,phpstan.neon.dist,phpunit.xml.dist,.wp-env.json,.distignore,.gitignore,.gitattributes,Readme.md"
          ignore-warnings: true
